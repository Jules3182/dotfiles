"$schema" = 'https://starship.rs/config-schema.json'

format = """
[┌─](fg:#DE5A6C)\
[](fg:#B0A3D2)\
[   ](bg:#B0A3D2 fg:#090c0c)\
[](bg:#DE5A6C fg:#B0A3D2)\
$directory\
[](fg:#DE5A6C bg:#46366D)\
$git_branch\
$git_status\
[](fg:#46366D bg:#1E1830)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#1E1830 bg:#0B0811)\
$time\
[ ](fg:#0B0811)\
\n[└───>](fg:#DE5A6C)$character"""

[character]
success_symbol = '[](bold green)'

[directory]
style = "fg:#131313 bg:#DE5A6C"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…starship copy 2/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#46366D"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#46366D)]($style)'

[git_status]
style = "bg:#46366D"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#46366D)]($style)'

[nodejs]
symbol = ""
style = "bg:#1E1830"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#1E1830)]($style)'

[rust]
symbol = ""
style = "bg:#1E1830"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#1E1830)]($style)'

[golang]
symbol = ""
style = "bg:#1E1830"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#1E1830)]($style)'

[php]
symbol = ""
style = "bg:#1E1830"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#1E1830)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#0B0811"
format = '[[  $time ](fg:#a0a9cb bg:#0B0811)]($style)'
